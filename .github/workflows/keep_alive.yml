name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时ping一次
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" https://facebeautyapp.streamlit.app/
        
