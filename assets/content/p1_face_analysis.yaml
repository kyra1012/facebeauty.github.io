# p1_face_analysis.yaml
face:
  圆脸:
    name: "圆脸 (Round Face)"
    desc: "面部线条圆润无棱角，下颌线轻扫哑光修容（从耳前至下巴两侧），侧分八字刘海遮脸颊，弱化面部宽度"
  方脸:
    name: "方脸 (Square Face)"
    desc: "下颌折角明显，修容重点扫下颌角并晕染自然，用蓬松卷发遮挡下颌线，避免加重棱角感"
  长形脸:
    name: "长形脸 (Long Face)"
    desc: "中庭偏长，横向腮红扫苹果肌拉宽视觉，眉头适度下移，用阴影缩短上庭纵向比例"
  鹅蛋脸:
    name: "鹅蛋脸 (Oval Face)"
    desc: "线条流畅比例均衡，仅用高光提亮面中（额头、鼻尖、下巴），无需过多修容，突出原生优势"
  菱形脸:
    name: "菱形脸 (Diamond Face)"
    desc: "颧骨微凸，颧骨两侧轻扫阴影柔化，腮红扫在苹果肌下方，避免提亮颧骨"
  心形脸:
    name: "心形脸 (Heart Face)"
    desc: "宽额头尖下巴，额头两侧扫阴影缩宽，下巴处轻涂高光平衡比例，眉形选圆润款柔化额头"
  方圆脸:
    name: "方圆脸 (Square-Oval Face)"
    desc: "柔骨兼具，修容轻扫下颌线并晕染自然，眉形选带轻微弧度款，避免过直或过弯"
  短圆脸:
    name: "短圆脸 (Short Round Face)"
    desc: "脸宽接近脸长，鼻梁两侧修容延伸至眉尾拉纵向，眉头略上移，增加面部立体感"
  短方脸:
    name: "短方脸 (Short Square Face)"
    desc: "脸短下颌有折角，眉峰微挑拉高视觉，下颌线修容从耳前扫至下巴，弱化折角"

eyes:
  桃花眼:
    name: "桃花眼 (Peach Blossom Eyes)"
    desc: "眼尾微弯带媚态，浅粉眼影打底，眼尾叠加深粉晕染3mm，细眼线拉长不上挑，睫毛加密眼尾"
  杏眼:
    name: "杏眼 (Almond Eyes)"
    desc: "眼型圆润，大地色（浅咖+深棕）眼影消肿，睫毛根部加密，卧蚕用细闪提亮，避免过宽"
  丹凤眼:
    name: "丹凤眼 (Phoenix Eyes)"
    desc: "眼尾上挑，深咖色眼影扫眼尾并晕染，细眼线只画外1/3且微翘，睫毛选自然纤长款"
  圆眼:
    name: "圆眼 (Round Eyes)"
    desc: "眼裂高显圆钝，眼线只画眼尾不上挑，眼影横向晕染拉宽，睫毛选细长款，避开浓密款"
  细长眼:
    name: "细长眼 (Slender Eyes)"
    desc: "眼型狭长，浅橘色眼影横向拉伸，卧蚕从眼头画至眼尾，睫毛加密中间段，显眼型饱满"
  下垂眼:
    name: "下垂眼 (Downturned Eyes)"
    desc: "眼尾下垂，眼尾用棕色眼线上挑5°，卧蚕提亮眼尾1/2处，上眼睑尾部叠加浅色眼影提亮"
  三角眼:
    name: "三角眼 (Triangular Eyes)"
    desc: "上睑松弛眼尾下垂，上睑用哑光大地色消肿，眼尾加粗眼线并上挑，睫毛上翘支撑眼睑"
  吊梢眼:
    name: "吊梢眼 (Upturned Eyes)"
    desc: "眼尾自然上挑，眼尾眼影适度晕染柔和，眼线不超过眼尾2mm，下眼睑中段轻涂浅色眼影平衡"

brow:
  柳叶眉:
    name: "柳叶眉 (Willow Leaf Brow)"
    desc: "眉形细长弧度自然，眉峰在眼球外侧正上方，眉色比发色浅一度，用眉粉填充自然毛流"
  弯月眉:
    name: "弯月眉 (Crescent Brow)"
    desc: "眉形如新月弧度圆润，眉尾略低于眉头，眉宽约0.4cm，用眉笔勾勒轮廓后填色"
  欧式挑眉:
    name: "欧式挑眉 (European Arch Brow)"
    desc: "眉峰高挑距眉头1/3处，眉尾利落不拖沓，眉色偏深（接近发色），眉骨下方轻扫阴影增强立体"
  一字平眉:
    name: "一字平眉 (Flat Brow)"
    desc: "眉峰不明显线条平直，眉宽约0.5cm，眉色略浅于发色，用眉刷梳理后轻填缝隙"
  剑眉:
    name: "剑眉 (Sword Brow)"
    desc: "眉尾上扬英气十足，眉峰清晰锐利，眉色与发色一致，眉尾用眉胶定型避免下垂"
  八字眉:
    name: "八字眉 (Eight-Shaped Brow)"
    desc: "眉尾自然下垂，微调眉尾上扬1°，眉色偏浅，用眉粉填充眉尾并晕染，避免显丧"
  标准自然眉:
    name: "标准自然眉 (Natural Brow)"
    desc: "遵循原生眉骨走势，保留自然毛流，眉峰柔和不尖锐，用眉笔轻描缺毛处"

nose:
  标准直鼻:
    name: "标准直鼻 (Standard Straight Nose)"
    desc: "鼻梁挺直鼻头圆润，鼻根轻扫浅咖修容，鼻尖点涂极细高光（直径≤3mm），保持自然立体"
  肉肉鼻:
    name: "肉肉鼻 (Fleshy Nose)"
    desc: "鼻翼较宽，鼻翼两侧从鼻根扫至1/2处（用浅灰修容），鼻头不打高光，避免显宽"
  希腊鼻:
    name: "希腊鼻 (Greek Nose)"
    desc: "鼻梁高挺通直，鼻根至鼻尖轻扫浅金高光，鼻翼两侧不加重修容，避免显生硬"
  鹰钩鼻:
    name: "鹰钩鼻 (Hawk Nose)"
    desc: "鼻尖下垂显尖锐，鼻尖处用哑光浅色遮瑕柔化，鼻根修容不延伸至鼻尖，弱化钩状"
  小翘鼻:
    name: "小翘鼻 (Snub Nose)"
    desc: "鼻尖微微上翘，鼻梁用细头修容拉长，鼻尖点涂细闪高光（集中于顶端），强化翘度不夸张"

lip:
  标准花瓣唇:
    name: "标准花瓣唇 (Standard Petal Lip)"
    desc: "唇峰清晰唇珠圆润，用同色系唇线笔勾勒唇峰后填充，薄涂显日常，厚涂增强气场"
  M字唇:
    name: "M字唇 (M-Shape Lip)"
    desc: "上唇下缘呈M型，用唇线笔强化唇峰轮廓，唇珠点涂高光，选豆沙色、番茄色显元气"
  丰满唇:
    name: "丰满唇 (Full Lip)"
    desc: "唇肉饱满，用裸色唇线笔定界避免外扩，薄涂哑光口红，唇周用遮瑕细化边缘"
  薄唇:
    name: "薄唇 (Thin Lip)"
    desc: "上下唇较薄，唇线外扩0.5mm（不超过原生唇线），用滋润型口红填充，唇中叠加高光"
  覆舟唇:
    name: "覆舟唇 (Downturned Lip)"
    desc: "嘴角微垂，用唇线笔将嘴角上提1mm，上唇加厚中间段，选亮泽口红弱化下垂感"
  微笑唇:
    name: "微笑唇 (Smile Lip)"
    desc: "嘴角自然上扬，用浅色系口红薄涂，唇线模糊处理，嘴角点涂高光强化甜感"

skin:
  冷粉一白:
    name: "冷粉一白 (Cool Pink Fair)"
    desc: "冷调通透白皙，选银饰+莓果色/蓝调红口红，眼影选灰粉/冷棕，腮红选冷粉色"
  冷粉二白:
    name: "冷粉二白 (Cool Pink Medium Fair)"
    desc: "冷调自然白，眼影选灰粉/冷棕，口红选豆沙冷调，腮红选浅玫瑰色，饰品选银或白金"
  冷粉三白:
    name: "冷粉三白 (Cool Pink Light Medium)"
    desc: "冷调自然肤色，服装选雾霾蓝/冷紫，口红选玫瑰冷调，腮红选淡紫粉，适配银饰"
  暖黄一白:
    name: "暖黄一白 (Warm Yellow Fair)"
    desc: "暖调白皙带金感，选金饰+橘红/番茄色口红，眼影选大地色/焦糖色，腮红选橘粉色"
  暖黄二白:
    name: "暖黄二白 (Warm Yellow Medium Fair)"
    desc: "暖调自然白，眼影选大地色/焦糖色，口红选砖红，腮红选橘棕色，饰品选金饰更提气"
  暖黄三白:
    name: "暖黄三白 (Warm Yellow Light Medium)"
    desc: "暖调健康肤色，口红选橘棕/砖红，眼影选棕橘色，腮红选暖橙色，适配金饰"
  中性一白:
    name: "中性一白 (Neutral Fair)"
    desc: "冷暖平衡白皙，饰品金银皆可，口红选正红/豆沙，眼影选粉棕/大地色，腮红选自然粉"
  中性二白:
    name: "中性二白 (Neutral Medium Fair)"
    desc: "中性自然肤色，眼影选大地色/粉棕，口红选奶茶色，腮红选裸粉色，饰品无限制"
  小麦色:
    name: "小麦色 (Wheat Tone)"
    desc: "健康深色肤，口红选深砖红/巧克力色，眼影选古铜色，腮红选深橘色，适配金属色饰品"

prop:
  三庭比例均衡:
    name: "三庭比例均衡 (Balanced Thirds)"
    desc: "上中下庭接近1:1:1，清透底妆突出皮肤质感，重点强化单五官（眼或唇），无需比例修饰"
  上庭偏长:
    name: "上庭偏长 (Long Upper Third)"
    desc: "发际线至眉心长，眉头适度下移2mm，额头两侧扫阴影，避免高颅顶发型加重比例"
  上庭偏短:
    name: "上庭偏短 (Short Upper Third)"
    desc: "发际线至眉心短，眉位抬高2mm，用浅色修容扫发际线，增加上庭视觉长度"
  中庭偏长:
    name: "中庭偏长 (Long Middle Third)"
    desc: "眉心至鼻底长，鼻影缩短至鼻翼1/2处，横向腮红扫苹果肌，避免拉长型鼻妆"
  中庭偏短:
    name: "中庭偏短 (Short Middle Third)"
    desc: "眉心至鼻底短，鼻影从鼻根拉至鼻尖，提亮鼻底，腮红扫在颧骨上方拉长纵向"
  下庭偏长:
    name: "下庭偏长 (Long Lower Third)"
    desc: "鼻底至下巴长，下巴处轻扫哑光修容，唇妆加重厚度，避免下巴提亮"
  下庭偏短:
    name: "下庭偏短 (Short Lower Third)"
    desc: "鼻底至下巴短，下巴点涂高光拉长视觉，唇妆选浅色系，避免深色加重局促感"