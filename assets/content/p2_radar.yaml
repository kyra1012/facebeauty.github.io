# p2_radar.yaml
# 得分区间标准：根据偏离度判断。
score_ranges:
  high_score: [80, 100]
  mid_score: [51, 79]
  low_score: [0, 50]

# 一、个人特质 (Personal Trait)
personal_trait:
  eye_distance:  # 眼间距
    high_score:
      - "【架构分析】眼间距偏宽，面部留白充足，这是“鲶鱼系”高级脸的典型特征。"
      - "【气质解读】自带一种疏离、漫不经心的松弛感，极其耐看且抗老。"
      - "【风格定位】天然适配法式慵懒风或极简High Fashion路线，无需刻意追求大眼。"
    mid_score:
      - "【架构分析】眼间距符合“五眼”黄金比例，视觉重心聚焦且舒适。"
      - "【气质解读】既有少女的灵动，又不失端庄大气的稳重感。"
      - "【风格定位】属于万能架构，无论是浓艳的富贵花风还是清淡的伪素颜都能完美驾驭。"
    low_score:
      - "【架构分析】眼间距偏窄，五官排布紧凑，视觉冲击力极强。"
      - "【气质解读】自带一种聚焦的锐利感和精明感，容易给人留下深刻印象。"
      - "【风格定位】非常适合打造美艳御姐风或强调眉眼的英气妆容。"

  brow_eye_distance:  # 眉眼距
    high_score:
      - "【架构分析】眉眼间距开阔，上眼睑留白多，眼窝结构舒展。"
      - "【气质解读】给人一种清冷、不食人间烟火的清秀感，眼神显得柔和。"
      - "【风格定位】适合东方古典韵味的妆造，眼影晕染空间大，极具层次感。"
    mid_score:
      - "【架构分析】眉眼间距适中，眉骨与眼窝的衔接过渡自然。"
      - "【气质解读】眼神既深邃又不压抑，传达出一种平和坚定的神采。"
      - "【风格定位】标准的美人架构，无需特殊修饰即可展现眼睛神采。"
    low_score:
      - "【架构分析】典型的“眉压眼”架构，眉骨立体，眼窝深陷。"
      - "【气质解读】眼神极其深邃有力，带有一种混血感和英气逼人的攻气。"
      - "【风格定位】天生适合欧美风、泰式妆容，强调眉眼的立体结构优势。"

  thirds_balance:  # 三庭
    high_score:
      - "【架构分析】三庭中某一庭（通常为中庭）占比略长，面部纵向线条流畅。"
      - "【气质解读】脱离了幼态感，自带成熟、理智、高智感的御姐气场。"
      - "【风格定位】非常适合港风、职场大女主风格，气场强大。"
    mid_score:
      - "【架构分析】上中下三庭比例接近 1:1:1，面部骨骼分布极其均衡。"
      - "【气质解读】视觉上极其舒适和谐，属于标准的“端庄脸”架构。"
      - "【风格定位】可塑性极强，妆容重点在于保持比例的平衡美。"
    low_score:
      - "【架构分析】面部纵向紧凑，中庭或下庭偏短，呈现出幼态比例。"
      - "【气质解读】即使年龄增长也依然保留着少女的娇憨与元气感。"
      - "【风格定位】天然适配纯欲风、甜美爱豆风，亲和力满分。"

  face_fold:  # 折叠度
    high_score:
      - "【架构分析】面部折叠度高，侧脸纵深大，正侧面转折清晰。"
      - "【气质解读】骨相极其优越，在镜头下没有死角，自带电影质感。"
      - "【风格定位】适合强调骨骼感的高级妆容，无需过度修容即可立体。"
    mid_score:
      - "【架构分析】面部折叠度适中，既有骨骼支撑，又有皮肉包裹。"
      - "【气质解读】轮廓线条柔和流畅，兼具立体感与女性的柔美感。"
      - "【风格定位】适合大多数日常妆容，给人舒服、耐看的视觉体验。"
    low_score:
      - "【架构分析】面部折叠度较低，面部平整度高，正脸留白较多。"
      - "【气质解读】自带一种温婉、古典的东方美感，极具亲和力。"
      - "【风格定位】适合日系清透妆或中式古典妆，强调面部的白皙与平整。"

  feature_compact:  # 聚集度
    high_score:
      - "【架构分析】五官相对集中，面部外轮廓留白较多，视觉中心聚焦。"
      - "【气质解读】这种架构往往伴随着极强的惊艳感，第一眼视觉冲击力大。"
      - "【风格定位】适合通过蓬松发型修饰外轮廓，打造“头包脸”的精致感。"
    mid_score:
      - "【架构分析】五官大小与面部留白比例恰到好处，分布舒展。"
      - "【气质解读】给人一种端庄、大气、舒展的美感，极其耐看。"
      - "【风格定位】无需刻意通过妆容调整五官位置，保持自然即可。"
    low_score:
      - "【架构分析】五官分布较为分散，面部留白多，显得舒展大气。"
      - "【气质解读】自带一种淡然、不争不抢的文艺气质，非常有辨识度。"
      - "【风格定位】适合淡颜系妆容，强调氛围感而非五官的刻画。"

  nose_shape:  # 鼻型
    high_score:
      - "【架构分析】鼻梁骨骼感强，鼻头精致小巧，线条利落。"
      - "【气质解读】鼻子作为面中之王，奠定了你清冷、高贵的面部基调。"
      - "【风格定位】侧颜杀手，适合弱化眼唇，突出鼻子的线条美。"
    mid_score:
      - "【架构分析】鼻型大小适中，与面部其他五官的量感非常匹配。"
      - "【气质解读】鼻子不突兀也不塌陷，很好的协调了面部的整体平衡。"
      - "【风格定位】百搭鼻型，各类风格妆容都能完美融合。"
    low_score:
      - "【架构分析】鼻头圆润有肉，鼻梁线条柔和，攻击性弱。"
      - "【气质解读】自带一种娇憨、可爱的钝感美，极其减龄。"
      - "【风格定位】不适合生硬的修容，应保留圆润感，走甜美邻家路线。"

