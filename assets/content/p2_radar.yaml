# 三、变美策略 (Beauty Strategy)
beauty_strategy:
  eye_distance:
    high_score:
      - "【眼头调整】用棕色眼线笔轻画内眼角（1mm以内），物理缩短眼距。"
      - "【眉形优化】眉头适当向内延伸，用眉粉晕染出自然的毛流感。"
      - "【鼻影衔接】加强山根两侧的修容，从眉头连接至鼻梁，拉近视觉中心。"
    mid_score:
      - "【眼头提亮】用珠光色提亮内眼角，增加眼神的通透感。"
      - "【眼尾晕染】眼影重点放在眼尾三角区，适当拉长眼型，增加妩媚感。"
      - "【眉眼平衡】保持眉头与内眼角垂直对齐，维持现有的黄金比例。"
    low_score:
      - "【眼尾拉长】眼线向外平拉 3mm，视觉上横向拉伸眼型。"
      - "【眉头外移】修掉眉头杂毛，让眉距略宽于眼距，缓解面部紧凑感。"
      - "【眼影技法】眼影采用后移画法，眼头留白，重点晕染眼尾后半段。"
  brow_eye_distance:
    high_score:
      - "【眉形下压】适当修除眉上缘杂毛，在眉下缘填充，降低视觉眉位。"
      - "【眼窝修容】用大地色眼影大面积铺色上眼皮，填补眉眼间的空旷感。"
      - "【睫毛强调】夹翘睫毛并刷浓密款睫毛膏，纵向填补眉眼间距。"
    mid_score:
      - "【眉骨提亮】在眉骨下方轻扫高光，增强眉眼的立体结构。"
      - "【色彩渐变】眼影采用“浅-中-深”渐变画法，不超出眼窝范围。"
      - "【自然眉流】保留眉毛的自然生长方向，打造妈生感的野生眉。"
    low_score:
      - "【眉形上提】修除眉下缘杂毛，在眉上缘描画，从视觉上抬高眉毛。"
      - "【眼妆消肿】避免大面积珠光眼影，选用哑光大地色消肿。"
      - "【截断画法】尝试截断式眼妆或只画眼尾眼影，留出眉眼间的呼吸感。"
  thirds_balance:
    high_score:
      - "【缩短中庭】横向打腮红，横跨鼻梁连接两颊，从视觉上截断中庭。"
      - "【发际线修饰】如果上庭长，用发际线粉填补，或尝试法式刘海。"
      - "【下睑下至】画出下眼睑下至线，并提亮卧蚕，降低眼位，缩短中庭。"
    mid_score:
      - "【高光聚焦】T区、下巴、面中三角区高光提亮，增加面部立体度。"
      - "【色彩和谐】统一眼妆、腮红和口红的色调，保持妆容的高级感。"
      - "【突出优势】选择一个五官（如红唇或大眼）作为妆容重点，其他弱化。"
    low_score:
      - "【拉长中庭】高光提亮鼻梁中段，视觉上拉长鼻部线条。"
      - "【露额发型】避免厚重刘海，露出额头，增加上庭的纵向长度。"
      - "【弱化下至】下眼影范围不要过大，避免进一步降低眼位。"
  face_fold:
    high_score:
      - "【柔和修容】避免颜色过深的修容，选用灰棕色轻扫颧骨下方即可。"
      - "【面中提亮】用哑光高光提亮面中凹陷处，平衡外轮廓的骨骼感。"
      - "【曲线眉形】选择带弧度的弯眉或柳叶眉，中和面部硬朗的直线条。"
    mid_score:
      - "【标准修容】在颧弓下和下颌线进行标准“3”字形修容。"
      - "【立体光影】T区高光与侧影配合，进一步强化骨相的精致度。"
      - "【清晰轮廓】保持下颌线的清晰利落，避免颈部堆积感。"
    low_score:
      - "【重塑骨骼】利用深色修容在颧骨下和下颌缘大力度晕染，人造阴影。"
      - "【强调五官】妆容重点放在眉眼和红唇的色彩上，转移对轮廓的注意力。"
      - "【发型遮挡】利用八字刘海或两鬓碎发修饰脸颊两侧，物理瘦脸。"
  feature_compact:
    high_score:
      - "【眼尾延伸】利用眼线和眼影向外晕染，视觉上发散五官。"
      - "【弱化内轮廓】避免眉头过近，唇妆边缘晕染模糊，减少局促感。"
      - "【面中留白】不要在面中堆砌过多色彩（如过重的晒伤腮红）。"
    mid_score:
