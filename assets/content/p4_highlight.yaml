# p4_highlight.yaml
# 五官高光描述：基于面部数据输出 1对1 专家建议与落地妆容方案
highlight_features:
  # 一、眼睛（核心数据：眼型、纵横比、眼尾角度、圆弧半径）
  eye:
    桃花眼:
      core_detail: "你的桃花眼眼尾自然上扬{angle:.1f}°，眼长与眼宽比达{ear:.2f}，眼部架构自带故事感。"
      star_similarity: "与{star_name}的桃花眼核心相似度为{score:.1f}%，肉眼看几乎高度重合。<br><br><b>💡 1对1建设性建议：</b>基于你眼尾{angle:.1f}°的上扬弧度，建议避免厚重的全包眼线，而是利用这种天然曲率，在眼尾1/3处进行柔和色块叠加，将成熟感转化为更高级的“疏离感”美学。"
      makeup_advice: "先用浅粉色眼影从眼头铺至眼尾外侧3mm，眼尾叠加深粉色晕染成月牙状且不超过眉骨，内眼线仅画眼尾1/2，外眼线沿眼尾自然上扬{angle:.1f}°，长度控制在2-3mm且末端细尖。"
      tool_tips: "推荐使用直径6mm的扁头眼影刷晕染眼尾，眼线笔按肤色选择棕色（冷皮）或黑色（暖皮），避免使用钝头笔影响精细度。"

    杏眼:
      core_detail: "你的杏眼眼睑裂宽度适中，眼纵横比{ear:.2f}，圆弧半径达{radius:.1f}mm，视觉效果十分清澈。"
      star_similarity: "与{star_name}的杏眼核心相似度为{score:.1f}%，肉眼看几乎高度重合。<br><br><b>💡 1对1建设性建议：</b>你拥有极佳的眼部留白，{radius:.1f}mm的圆润眼头是亲和力的关键。建议保持这种“幼态感”，妆容核心应放在增强眼神明亮度，利用哑光质地提亮卧蚕，将清纯特质发挥到极致。"
      makeup_advice: "用大地色做渐变处理，浅咖色铺满全眼，深棕色仅扫眼尾2mm且不拉长，仅画内眼线并用棉签晕开边缘，全眼选择9mm自然款睫毛，卧蚕全段用哑光米色提亮。"
      tool_tips: "眼影优先选细腻哑光质地避免珠光显肿，卧蚕笔按肤色选择浅米色（冷皮）或浅橘色（暖皮），贴合肤色更自然。"

    丹凤眼:
      core_detail: "你的丹凤眼眼尾上挑{angle:.1f}°，眼长是宽度的{ratio:.2f}倍，具备典型的东方古典架构。"
      star_similarity: "与{star_name}的丹凤眼核心相似度为{score:.1f}%，肉眼看几乎高度重合。<br><br><b>💡 1对1建设性建议：</b>这种极致的横向拉伸感（{ratio:.2f}倍）是超模脸的基础。建议顺应{angle:.1f}°的上挑走势绘制锐利线条，通过弱化眼影、强化眼线的方式，打造辨识度极高的“高级冷风格”。"
      makeup_advice: "以深咖色为眼影打底，眼尾叠加深棕色且仅晕染至眼尾3mm，内眼线画满全眼，外眼线沿眼尾上挑{angle:.1f}°，长度3mm呈细尖状，睫毛膏竖向刷增加纤长感。"
      tool_tips: "眼线笔选择防水款防止晕染，修容刷选直径3mm细头，沿眼尾上挑方向轻扫确保精准度。"

    圆眼:
      core_detail: "你的圆眼眼裂高{height:.1f}mm，眼纵横比{ear:.2f}，黑眼珠暴露度75%，具有天然的灵动力。"
      star_similarity: "与{star_name}的圆眼核心相似度为{score:.1f}%，肉眼看几乎高度重合。<br><br><b>💡 1对1建设性建议：</b>针对你纵向占比极高的圆眼（{ear:.2f}），建议进行“横向破局”。通过水平延伸外眼线3mm，人为增加眼裂宽度，平衡幼态带来的钝感，从而将活泼属性升级为更具智力感的优雅风格。"
      makeup_advice: "眼影采用横向晕染方式，浅橘色铺满全眼，眼尾外侧2mm叠深橘色拉长眼型，仅画外眼线眼尾2mm且水平延伸不上扬，末端处理为钝圆，眼中睫毛加密。"
      tool_tips: "避免使用圆形眼影刷，选择扁平刷做横向晕染，搭配纵向拉长款唇妆平衡眼型圆润感。"

  # 二、鼻子（核心数据：鼻宽比、鼻头直径、斜率、长度、直线度）
  nose:
    标准直鼻:
      core_detail: "你的标准直鼻鼻梁挺直，鼻宽比为{ratio:.2f}，鼻尖连线斜率表现完美。"
      star_similarity: "与{star_name}的标准直鼻核心相似度为{score:.1f}%，肉眼看几乎高度重合。<br><br><b>💡 1对1建设性建议：</b>基于你{ratio:.2f}的比例，你具备极佳的骨相底子。修容时应避开“全段贯穿阴影”，仅在鼻头上方2mm处进行点状修容，利用明暗对比强调鼻尖的微翘感，打造电影侧颜。"
      makeup_advice: "在鼻根1/3处轻扫浅咖修容，宽度控制在1mm且不延伸至鼻尖，高光从鼻根扫至鼻尖1/2处，选用直径3mm细闪高光，鼻翼外侧0.3cm处扫浅灰修容。"
      tool_tips: "修容刷选45°斜头款方便精准控制范围，高光选细闪质地，避免大颗粒款式显毛孔。"

    肉肉鼻:
      core_detail: "你的肉肉鼻鼻翼宽{width:.1f}mm，鼻头圆润度{roundness:.1f}，给人亲切且有福气的印象。"
      star_similarity: "与{star_name}的肉肉鼻核心相似度为{score:.1f}%，肉眼看几乎高度重合。<br><br><b>💡 1对1建设性建议：</b>鼻头圆润（{roundness:.1f}）是幼态脸的核心。不要一味追求变细，而是利用修容在鼻翼制造V型阴影，增加鼻尖的转折感，使气质在清纯中透出一丝精致的知性美。"
      makeup_advice: "从鼻根1/2处扫浅灰修容至鼻翼外侧0.5cm，高光仅扫鼻梁中央1mm宽，从鼻根至鼻尖1/3处不覆盖鼻头，鼻头两侧用修容笔点涂后晕开。"
      tool_tips: "修容按肤色选择冷调浅灰或暖调浅棕，避免深修容导致妆感显脏，注重边缘自然晕染。"

    希腊鼻:
      core_detail: "你的希腊鼻鼻梁高挺通直，直线度达{straightness:.2f}，骨相高度发育。"
      star_similarity: "与{star_name}的希腊鼻核心相似度为{score:.1f}%，肉眼看几乎高度重合。<br><br><b>💡 1对1建设性建议：</b>由于直线度（{straightness:.2f}）极高，容易显得过于硬朗。建议弱化鼻梁边缘线，改用哑光高光而非珠光，在保留长度优势的同时中和掉骨相过强带来的“冲击感”，实现刚柔并济。"
      makeup_advice: "仅在鼻根两侧轻扫浅咖修容，宽度0.8mm。高光从鼻根扫至鼻尖选用哑光质地，宽度1.5mm，鼻翼内侧0.2cm处扫浅修容。"
      tool_tips: "高光优先选哑光质地，避免细闪加重鼻梁突兀感，修容用量严格控制在0.3g内。"

    小翘鼻:
      core_detail: "你的小翘鼻鼻尖上翘达{angle:.1f}°，比例非常俏皮灵动。"
      star_similarity: "与{star_name}的小翘鼻核心相似度为{score:.1f}%，肉眼看几乎高度重合。<br><br><b>💡 1对1建设性建议：</b>你拥有非常优越的{angle:.1f}°鼻尖上翘角。建议在鼻尖最顶点点缀“圆点细闪高光”，利用光泽感进一步放大这种弧度，配合短中庭的视觉特征，能显著提升面部的活泼感。"
      makeup_advice: "鼻根至鼻尖两侧扫浅咖修容，宽度1mm。高光从鼻根扫至鼻尖顶端选用细闪质地，鼻尖处加重上色，鼻头下方不扫修容保留上翘弧度。"
      tool_tips: "鼻尖高光选细闪香槟色提升精致感，修容刷选细头款式，避免破坏翘鼻自然弧度。"

  # 三、嘴唇（核心数据：折角、唇珠高度、厚度比、唇宽比）
  lip:
    M字唇:
      core_detail: "你的M字唇唇峰折角为{angle:.1f}°，唇珠高度达{bead_height:.1f}mm，形态极其精致。"
      star_similarity: "与{star_name}的M字唇核心相似度为{score:.1f}%，肉眼看几乎高度重合。<br><br><b>💡 1对1建设性建议：</b>天然的M型曲率（{angle:.1f}°）具有极强的雕刻美。建议在中央点涂镜面唇釉，利用{bead_height:.1f}mm的唇珠落差制造动态光影，会让你的谈吐举止间更具吸引力。"
      makeup_advice: "用唇线笔强化唇峰M型，保留唇珠高度不夸张，先薄涂全唇再在唇峰叠加细闪唇釉，唇珠中央点涂极细高光，嘴角上提0.5mm画唇线。"
      tool_tips: "唇线笔选与口红同色系浅一度款式，搭配宽度2mm扁头唇刷，精准勾勒唇峰细节。"

    丰满唇:
      core_detail: "你的丰满唇厚度比为{thickness_ratio:.2f}，具有极强的视觉存在感。"
      star_similarity: "与{star_name}的丰满唇核心相似度为{score:.1f}%，肉眼看几乎高度重合。<br><br><b>💡 1对1建设性建议：</b>唇部量感较大（{thickness_ratio:.2f}）是性感的特质。建议采用“内深外浅”的渐变画法，将深色集中在唇心，边缘用棉签模糊，这样能保留丰盈感，同时避免视觉上的局促感。"
      makeup_advice: "仅勾勒唇外侧0.3mm唇线且不内收，用棉签晕开边缘。选择哑光质地口红薄涂全唇，唇周1mm处扫浅灰修容并打圈晕染。"
      tool_tips: "口红按肤色选择红调或橘调，避免珠光质地加重唇厚视觉感，修容用量严格控制。"

    标准花瓣唇:
      core_detail: "你的标准花瓣唇上下唇厚度比为{thickness_ratio:.2f}，比例非常和谐。"
      star_similarity: "与{star_name}的标准花瓣唇核心相似度为{score:.1f}%，肉眼看几乎高度重合。<br><br><b>💡 1对1建设性建议：</b>由于你的比例已经非常稳定（{thickness_ratio:.2f}），建议尝试“质地反差”策略：在下唇边缘使用哑光，唇峰则点缀一点微光唇蜜，利用质地变化增加标准唇型的时尚高级感。"
      makeup_advice: "精准勾勒唇峰与唇边缘。日常选奶茶色，正式场合选正红色。用口红在唇珠叠加一层增强圆润感，嘴角自然填充不刻意上提。"
      tool_tips: "唇线笔选与口红同色系，搭配圆头唇刷均匀填充，避免出现色块断层。"

    微笑唇:
      core_detail: "你的微笑唇嘴角天然上扬{angle:.1f}°，气质非常亲和治愈。"
      star_similarity: "与{star_name}的微笑唇核心相似度为{score:.1f}%，肉眼看几乎高度重合。<br><br><b>💡 1对1建设性建议：</b>天然上扬角是你的秘密武器。建议在嘴角处加重一点阴影延伸，人为营造出一种“似笑非笑”的神秘感，结合唇部厚度，打造出专属的治愈系美感。"
      makeup_advice: "嘴角沿上扬角度延伸1mm画唇线，唇峰做圆润处理。选择浅色系（浅粉/奶茶色）口红薄涂全唇，嘴角处加重上色，唇下方1mm处扫浅修容。"
      tool_tips: "口红选滋润质地避免哑光显嘴角干燥，唇线笔选浅色系，让唇线与唇色自然过渡。"

  # 四、眉毛（核心数据：眉峰位置、眉弧度、长度、高度差）
  brow:
    柳叶眉:
      core_detail: "你的柳叶眉眉长达{length:.1f}mm，线条流畅且具古典韵味。"
      star_similarity: "与{star_name}的柳叶眉核心相似度为{score:.1f}%，肉眼看几乎高度重合。<br><br><b>💡 1对1建设性建议：</b>你的弧度表现出极佳的女性化气质。建议画眉时将眉尾适当拉细长，并让眉尾略微下垂，这能顺应你天然的骨骼走势，让面部呈现出更具古典美的平衡感。"
      makeup_advice: "眉笔按肤色选择深棕或棕咖。从眉尾1/3处开始画，眉头轻扫，眉峰做圆润处理，高度不超过眉骨2mm，眉尾下摆，长度与眼尾对齐。"
      tool_tips: "眉笔选0.5mm细头款保证精细度，搭配斜头眉刷梳理眉流，避免结块。"

    弯月眉:
      core_detail: "你的弯月眉眉峰弧度达{arc:.2f}，眉尾长度占比极高。"
      star_similarity: "与{star_name}的弯月眉核心相似度为{score:.1f}%，肉眼看几乎高度重合。<br><br><b>💡 1对1建设性建议：</b>高弧度（{arc:.2f}）的气质温婉。核心建议是“弱化边界线”，不要用笔尖框死形状，改用眉粉做雾感填充，利用眉毛本身的柔光感来衬托你大气的眼部架构。"
      makeup_advice: "用眉笔勾勒眉型轮廓，眉峰定位在眼球外侧正上方，眉粉均匀填充，眉头浅、眉尾深形成渐变。眉尾略低于眉头1mm，长度与眼尾1/2处对齐。"
      tool_tips: "眉粉选双色盘方便打造渐变，眉胶选透明款，不破坏眉色本身。"

    欧式挑眉:
      core_detail: "你的欧式挑眉眉峰上扬达{angle:.1f}°，高度差表现极佳。"
      star_similarity: "与{star_name}的欧式挑眉核心相似度为{score:.1f}%，肉眼看几乎高度重合。<br><br><b>💡 1对1建设性建议：</b>这种上扬角度（{angle:.1f}°）是视觉上提升眼眶深邃度的关键。建议在眉峰下方使用哑光高光大面积提亮，强化眉骨的骨相感，让你的五官呈现出极具力量感的精英气场。"
      makeup_advice: "眉笔从眉头画至眉峰，眉峰处加重上色，眉尾处理为细尖状。眉粉填充眉峰至眉尾，眉骨下方扫提亮色，长度与眼尾外侧1mm对齐。"
      tool_tips: "眉笔选深棕色提升立体感，眉刷选硬头款精准勾勒眉峰，修容避免过重。"

    一字平眉:
      core_detail: "你的一字平眉平直度达{straight:.2f}，风格极其简约干练。"
      star_similarity: "与{star_name}的一字平眉核心相似度为{score:.1f}%，肉眼看几乎高度重合。<br><br><b>💡 1对1建设性建议：</b>过于平直的眉毛容易让脸型显短。建议在眉尾处增加一个15°的微微下折角，在保持平眉带来的英气同时，增加一点收尾感，从而在视觉上起到收敛脸型的效果。"
      makeup_advice: "眉笔水平勾勒眉身，保证眉头至眉尾厚度一致。眉粉均匀填充。眉胶梳理眉流保持平直状态，眉尾做圆润处理，长度与眼尾对齐。"
      tool_tips: "眉笔选择浅棕或棕咖。眉宽严格控制在0.5cm内，避免过宽显凶。"